name: Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: movie-hub-admin-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Configure separate admin release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVIE_HUB_ADMIN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOVIE_HUB_ADMIN_KEYSTORE_PASSWORD }}
          ADMIN_URL: ${{ vars.MOVIE_HUB_ADMIN_URL }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Admin signing secrets: missing (values are never displayed)."
            exit 0
          fi
          echo "Admin signing secrets: configured."
          if [ -z "$ADMIN_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Admin hosting URL variable: missing; signed APK deferred."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/movie-hub-admin-release.jks"
          cat > signing.properties <<EOF
          storeFile=$RUNNER_TEMP/movie-hub-admin-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=movie-hub-admin
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build updateable signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          MOVIE_HUB_ADMIN_URL: ${{ vars.MOVIE_HUB_ADMIN_URL }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.configured == 'true'
        with:
          name: movie-hub-admin-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
