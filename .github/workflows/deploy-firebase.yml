name: Deploy Movie Hub Admin

on:
  workflow_dispatch:
    inputs:
      target:
        description: Admin component to deploy
        required: true
        type: choice
        options:
          - hosting
          - functions

permissions:
  contents: read
  id-token: write

concurrency:
  group: movie-hub-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: inputs.target == 'functions'
        run: npm ci --prefix functions
      - if: inputs.target == 'functions'
        run: npm test --prefix functions
      - name: Authenticate with the admin-only deployment identity
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/movie-hub-admin-github/providers/github
          service_account: github-movie-hub-admin-deploy@movie-hub-62459.iam.gserviceaccount.com
      - name: Deploy only the separate admin Hosting site
        if: inputs.target == 'hosting'
        run: npx --yes firebase-tools@15.30.2 deploy --only hosting:admin --project movie-hub-62459 --non-interactive
      - name: Deploy only the admin Functions codebase
        if: inputs.target == 'functions'
        run: npx --yes firebase-tools@15.30.2 deploy --only functions:movie-hub-admin --project movie-hub-62459 --non-interactive
